apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: 3cx-zammad-bridge
  title: 3CX ↔ Zammad Bridge
  description: >-
    Go daemon that polls the 3CX phone system for active calls and forwards
    call events to Zammad's CTI webhook. AGM fork of
    qmexnetworks/3cx-zammad-bridge (forked at upstream v0.8.0) with AGM
    changes: polling through the 3CX XAPI ActiveCalls endpoint, creating a
    Zammad phone ticket (and customer) when a call ends, direction and
    extension filters that fail closed, a repeat-call de-duplication window,
    the 3CX call ID on tickets, and a password-protected admin page
    (/bridge-admin/) that changes these settings without a restart.
  tags:
    - go
    - cti
    - 3cx
    - zammad
    - telephony
  links:
    - url: https://github.com/AGM-One-Vision/3cx-zammad-bridge
      title: Source (AGM fork)
      icon: github
    - url: https://github.com/qmexnetworks/3cx-zammad-bridge
      title: Upstream repository
      icon: github
    - url: https://helpdesk.agmegypt.com
      title: Zammad (destination instance)
      icon: dashboard
    - url: https://helpdesk.agmegypt.com/bridge-admin/
      title: Bridge admin page
      icon: dashboard
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: AGM-One-Vision/3cx-zammad-bridge
    devhub.agm/origin: forked-oss
    devhub.agm/upstream-repo: https://github.com/qmexnetworks/3cx-zammad-bridge
    devhub.agm/visibility: internal
spec:
  type: service
  lifecycle: production
  owner: group:default/dto
  system: system:default/zammad
  dependsOn:
    - component:default/zammad
